name: Prompt Foundry MVP Build V3

on:
  push:
    branches:
      - feature/prompt-foundry-mvp
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Rehydrate source
        run: |
          base64 -d prompt-foundry/payload-v2.b64 > /tmp/prompt-foundry.zip
          unzip -oq /tmp/prompt-foundry.zip -d "$GITHUB_WORKSPACE"
      - name: Assemble debug APK
        run: gradle -p prompt-foundry :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prompt-Foundry-MVP-debug-v3
          path: prompt-foundry/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Prompt-Foundry-MVP-source-v3
          path: /tmp/prompt-foundry.zip
