name: Android CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list --include_obsolete > /tmp/sdk-packages.txt
          if grep -q 'platforms;android-37.0' /tmp/sdk-packages.txt; then
            PLATFORM='platforms;android-37.0'
          elif grep -q 'platforms;android-CinnamonBun' /tmp/sdk-packages.txt; then
            PLATFORM='platforms;android-CinnamonBun'
          elif grep -q 'platforms;android-37' /tmp/sdk-packages.txt; then
            PLATFORM='platforms;android-37'
          else
            echo 'Android 17 platform package not found. Available candidates:'
            grep -E 'platforms;android-(37|CinnamonBun)' /tmp/sdk-packages.txt || true
            exit 1
          fi
          yes | sdkmanager "$PLATFORM" 'build-tools;37.0.0' || true
          sdkmanager "$PLATFORM" 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Prepare permanent signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SECOND_BRAIN_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SECOND_BRAIN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SECOND_BRAIN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SECOND_BRAIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo 'Missing SECOND_BRAIN_KEYSTORE_B64'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing SECOND_BRAIN_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing SECOND_BRAIN_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing SECOND_BRAIN_KEY_PASSWORD'; exit 1; }
          KEYSTORE="$RUNNER_TEMP/second-brain-permanent.p12"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "SB_SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "SB_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SB_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SB_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Unit tests
        run: gradle test --stacktrace
      - name: Assemble debug
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify permanent APK signature
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Second-Brain-M4-permanent-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
