name: Android CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list --include_obsolete > /tmp/sdk-packages.txt
          if grep -q 'platforms;android-37.0' /tmp/sdk-packages.txt; then
            PLATFORM='platforms;android-37.0'
          elif grep -q 'platforms;android-CinnamonBun' /tmp/sdk-packages.txt; then
            PLATFORM='platforms;android-CinnamonBun'
          elif grep -q 'platforms;android-37' /tmp/sdk-packages.txt; then
            PLATFORM='platforms;android-37'
          else
            echo 'Android 17 platform package not found. Available candidates:'
            grep -E 'platforms;android-(37|CinnamonBun)' /tmp/sdk-packages.txt || true
            exit 1
          fi
          yes | sdkmanager "$PLATFORM" 'build-tools;37.0.0' || true
          sdkmanager "$PLATFORM" 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit tests
        run: gradle test --stacktrace
      - name: Assemble debug and unsigned release
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Second-Brain-M3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Second-Brain-M3-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
