name: Prompt Foundry 0.2 Build

on:
  push:
    branches:
      - feature/prompt-foundry-v0.2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble debug APK
        run: gradle -p prompt-foundry :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prompt-Foundry-0.2.0-debug
          path: prompt-foundry/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Package source
        run: zip -qr /tmp/Prompt-Foundry-0.2.0-source.zip prompt-foundry
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Prompt-Foundry-0.2.0-source
          path: /tmp/Prompt-Foundry-0.2.0-source.zip
