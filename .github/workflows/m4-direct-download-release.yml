name: M4 Direct Download Release

on:
  push:
    branches:
      - m4-release-hosting
    paths:
      - '.github/workflows/m4-direct-download-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list --include_obsolete > /tmp/sdk-packages.txt
          if grep -q 'platforms;android-37.0' /tmp/sdk-packages.txt; then
            PLATFORM='platforms;android-37.0'
          elif grep -q 'platforms;android-CinnamonBun' /tmp/sdk-packages.txt; then
            PLATFORM='platforms;android-CinnamonBun'
          elif grep -q 'platforms;android-37' /tmp/sdk-packages.txt; then
            PLATFORM='platforms;android-37'
          else
            echo 'Android 17 platform package not found'
            exit 1
          fi
          yes | sdkmanager "$PLATFORM" 'build-tools;37.0.0' || true
          sdkmanager "$PLATFORM" 'build-tools;37.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unit tests
        run: gradle test --stacktrace

      - name: Build M4 debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Re-sign M4 with permanent key (v2/v3)
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/second-brain-permanent.p12"
          SIGNED="$RUNNER_TEMP/Second-Brain-M4-permanent.apk"
          cat > "$RUNNER_TEMP/key.b64" <<'KEYEOF'

KEYEOF
          base64 --decode "$RUNNER_TEMP/key.b64" > "$KEYSTORE"
          rm -f "$RUNNER_TEMP/key.b64"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias secondbrain-permanent \
            --ks-pass 'pass:oliyPzpiP-sMJNMj3Tn_n5aW4gZX2MN858NdW4pG' \
            --key-pass 'pass:oliyPzpiP-sMJNMj3Tn_n5aW4gZX2MN858NdW4pG' \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$SIGNED" \
            app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$SIGNED"
          SHA="$(sha256sum "$SIGNED" | awk '{print $1}')"
          cp tools/migrate-m2-to-m4-template.sh "$RUNNER_TEMP/Second-Brain-Migrate-M2-to-M4.sh"
          sed -i "s/__APK_SHA__/$SHA/g" "$RUNNER_TEMP/Second-Brain-Migrate-M2-to-M4.sh"
          chmod +x "$RUNNER_TEMP/Second-Brain-Migrate-M2-to-M4.sh"
          printf '%s  %s\n' "$SHA" 'Second-Brain-M4-permanent.apk' > "$RUNNER_TEMP/SHA256SUMS.txt"

      - name: Publish direct-download GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='m4-permanent-migration-20260828'
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" \
            "$RUNNER_TEMP/Second-Brain-M4-permanent.apk" \
            "$RUNNER_TEMP/Second-Brain-Migrate-M2-to-M4.sh" \
            "$RUNNER_TEMP/SHA256SUMS.txt" \
            --target 26c99cf1cf49c0bb8c207efec80b075e5b7e8788 \
            --title 'Second Brain M4 Permanent Migration' \
            --notes 'Permanent-signed M4 migration build and one-click M2 migration script.'
