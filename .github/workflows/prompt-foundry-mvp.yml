name: Prompt Foundry MVP Build

on:
  push:
    branches: [ "feature/prompt-foundry-mvp" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Rehydrate Prompt Foundry source
        shell: bash
        run: |
          cat > /tmp/pf.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/pf.b64 > /tmp/prompt-foundry.zip
          unzip -oq /tmp/prompt-foundry.zip -d "$GITHUB_WORKSPACE"
      - name: Assemble debug APK
        run: gradle -p prompt-foundry :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Prompt-Foundry-MVP-debug
          path: prompt-foundry/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Prompt-Foundry-MVP-source
          path: /tmp/prompt-foundry.zip
