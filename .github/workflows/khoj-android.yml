name: Build Khoj Local Android APK

on:
  push:
    branches:
      - khoj-android-client
    paths:
      - 'khoj-android/**'
      - '.github/workflows/khoj-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct native activity
        shell: bash
        run: |
          set -euo pipefail
          SRC='khoj-android/app/src/main/java/com/kareem/khojlocal'
          cat "$SRC/.mainactivity.part1.b64" "$SRC/.mainactivity.part2.b64" "$SRC/.mainactivity.part3.b64" "$SRC/.mainactivity.part4.b64" | tr -d '\r\n' | base64 --decode > "$SRC/MainActivity.kt"
          test -s "$SRC/MainActivity.kt"
          grep -q 'class MainActivity' "$SRC/MainActivity.kt"

      - name: Build APK
        working-directory: khoj-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: cp khoj-android/app/build/outputs/apk/debug/app-debug.apk khoj-android/Khoj-Local-1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Khoj-Local-Android-APK
          path: khoj-android/Khoj-Local-1.0.0.apk
          if-no-files-found: error
